name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Detect whether code-relevant files changed (native git, no third-party
      # action). Doc-only changes (README, docs/, LICENSE, ...) skip the heavy
      # steps below, but the job still succeeds so the required "build" check is
      # always reported.
      - id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "base commit unavailable - running full pipeline"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(git diff --name-only "${BASE}...${HEAD}")"
          echo "Changed files:"; echo "$FILES"
          if echo "$FILES" | grep -qE '^(src/|public/|package\.json|package-lock\.json|wxt\.config\.ts|tsconfig\.json|vitest\.config\.ts|\.github/workflows/ci\.yml)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false (doc-only) - skipping build/tests"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - if: steps.changes.outputs.code == 'true'
        run: npm ci
      - if: steps.changes.outputs.code == 'true'
        run: npm run compile
      - if: steps.changes.outputs.code == 'true'
        run: npm test
      - if: steps.changes.outputs.code == 'true'
        run: npm run build
