name: Release

# Publishes a GitHub Release automatically when the version in package.json
# changes. The only manual step stays the version bump in a PR: once that PR
# is merged into main, this workflow builds the extension and creates the
# release + tag for that version. It is idempotent - pushes to main that do
# not introduce a new version (e.g. doc-only changes) are skipped, so no
# duplicate releases are created.

on:
  push:
    branches: [main]

permissions:
  contents: write # needed to create the release and its tag

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node is preinstalled on the runner, so we can read the version without
      # a full npm install - that way non-release pushes skip straight out.
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # "Done" means a release exists AND carries its chrome asset. A bare
          # release without the asset (e.g. a create that failed mid-upload) is
          # treated as not-done, so this run rebuilds and re-attaches the asset
          # instead of skipping over a broken release.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets[].name' 2>/dev/null | grep -q -- '-chrome.zip'; then
            echo "Release v$VERSION already published with its asset - skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$VERSION not published (or missing its asset) - will build and publish."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - if: steps.check.outputs.exists == 'false'
        run: npm ci

      - if: steps.check.outputs.exists == 'false'
        run: npm run build

      - if: steps.check.outputs.exists == 'false'
        run: npm run zip

      - if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # No concurrency guard, so several version bumps in quick succession
          # each publish their own version (a concurrency group would cancel
          # pending runs and drop a version). Try to create the release; if that
          # fails the release already exists - either a concurrent run for the
          # same version won the race, or an earlier run created it but failed
          # before attaching the asset. In both cases upload our freshly built
          # asset with --clobber, so we never accept a release that is missing
          # its asset. If the release genuinely does not exist, the upload fails
          # too and the step errors out (real failure, surfaced).
          if ! gh release create "v$VERSION" \
              .output/*-chrome.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --generate-notes; then
            echo "gh release create failed - release likely exists; ensuring the asset is attached."
            gh release upload "v$VERSION" .output/*-chrome.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
