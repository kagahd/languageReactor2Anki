name: Release

# Publishes a GitHub Release automatically when the version in package.json
# changes. The only manual step stays the version bump in a PR: once that PR
# is merged into main, this workflow builds the extension and creates the
# release + tag for that version. It is idempotent - pushes to main that do
# not introduce a new version (e.g. doc-only changes) are skipped, so no
# duplicate releases are created.

on:
  push:
    branches: [main]

permissions:
  contents: write # needed to create the release and its tag

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node is preinstalled on the runner, so we can read the version without
      # a full npm install - that way non-release pushes skip straight out.
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # "Done" means a PUBLISHED (non-draft) release that carries a fully
          # UPLOADED -chrome.zip asset. A draft, or a release whose asset upload
          # did not finish (state != uploaded), counts as not-done - so an
          # incomplete release is never mistaken for a finished one; this run
          # (re)builds and publishes instead of skipping.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null \
               | jq -e '.isDraft == false and (.assets | any(.state == "uploaded" and (.name | endswith("-chrome.zip"))))' >/dev/null; then
            echo "Release v$VERSION already published with its asset - skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$VERSION not fully published yet - will build and publish."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - if: steps.check.outputs.exists == 'false'
        run: npm ci

      - if: steps.check.outputs.exists == 'false'
        run: npm run build

      - if: steps.check.outputs.exists == 'false'
        run: npm run zip

      - if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # No concurrency guard, so several version bumps in quick succession
          # each publish their own version (a concurrency group would cancel
          # pending runs and drop a version). Create the release+tag with the
          # freshly built asset. If create fails, the release already exists:
          #   - a concurrent run for the SAME version won the race, or
          #   - an earlier run left a broken (assetless) release.
          # We must NOT overwrite a COMPLETE asset: it was built from the tagged
          # commit, while ours may come from a different same-version commit, so
          # replacing it would make the asset mismatch the tag. So: if a fully
          # uploaded asset is already attached we are done (the concurrent
          # winner's asset stays untouched). Only when no complete asset exists
          # do we attach our freshly built one (--clobber to replace a stuck,
          # half-uploaded asset), repairing a create that failed mid-upload.
          if ! gh release create "v$VERSION" \
              .output/*-chrome.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --generate-notes; then
            if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets 2>/dev/null \
                 | jq -e '.assets | any(.state == "uploaded" and (.name | endswith("-chrome.zip")))' >/dev/null; then
              echo "Release v$VERSION already exists with its uploaded asset (won by a concurrent run) - nothing to do."
            else
              echo "Release v$VERSION exists without a complete asset - attaching the freshly built one."
              gh release upload "v$VERSION" .output/*-chrome.zip --repo "$GITHUB_REPOSITORY" --clobber
            fi
          fi
